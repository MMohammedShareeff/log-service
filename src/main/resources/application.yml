spring:
  application:
    name: log-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logs}
    username: ${SPRING_DATASOURCE_USERNAME:logs}
    password: ${SPRING_DATASOURCE_PASSWORD:logs}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 3
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO

app:
  auth:
    enabled: ${AUTH_ENABLED:false}
    loadgen-api-key: ${LOADGEN_API_KEY:}
  ingest:
    batch-size: ${INGEST_BATCH_SIZE:1000}
    coalesce-window-ms: ${INGEST_COALESCE_WINDOW_MS:5}
    coalesce-max-rows: ${INGEST_COALESCE_MAX_ROWS:2000}
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: ${RETENTION_CRON:0 0 0 * * *}
    zone: ${RETENTION_ZONE:UTC}
    retention-days: ${RETENTION_DAYS:30}
    partition-days-ahead: ${PARTITION_DAYS_AHEAD:7}
    lock-timeout: ${RETENTION_LOCK_TIMEOUT:2s}
