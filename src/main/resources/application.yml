spring:
  application:
    name: log-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logs}
    username: ${SPRING_DATASOURCE_USERNAME:logs}
    password: ${SPRING_DATASOURCE_PASSWORD:logs}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO

app:
  auth:
    enabled: ${AUTH_ENABLED:false}
    loadgen-api-key: ${LOADGEN_API_KEY:}
